name: Release packages

# Builds the release packages for every OS and keeps them as workflow artifacts.
# It does NOT publish a GitHub release: download the artifacts, test them, then attach them to a release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version of the packages (for example 2.2.0)
        required: true
      tools_release:
        description: Existing release whose Windows zip provides the Tools folder
        required: true
        default: v2.1.0

jobs:
  package:
    name: ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
          - os: macos-latest
            rid: osx-x64
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Get the Tools folder
        shell: bash
        run: |
          gh release download "${{ inputs.tools_release }}" --repo "$GITHUB_REPOSITORY" --pattern '*.Windows.zip' --dir _release
          unzip -q _release/*.zip -d _release/x   # the whole zip: unzip of Git for Windows does not match subfolders with 'Tools/*'
          test -f _release/x/Tools/PS4/gengp4_patch.exe
          mv _release/x/Tools Tools
      - name: Build (Windows)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: ./scripts/build-release.ps1 -Version "${{ inputs.version }}"
      - name: Build (Linux / macOS)
        if: matrix.rid != 'win-x64'
        run: bash scripts/build-release.sh "${{ inputs.version }}" "${{ matrix.rid }}"
      - uses: actions/upload-artifact@v4
        with:
          name: PS.Classics.fPKG.Builder.v${{ inputs.version }}.${{ matrix.rid }}
          path: |
            dist/*.zip
          if-no-files-found: error
