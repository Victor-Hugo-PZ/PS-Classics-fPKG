name: CI

on:
  push:
  pull_request:

jobs:
  windows:
    name: Windows app (build + tests)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # The Tools folder (third-party tools) is not part of the repository,
      # so the integration tests that need it are skipped here.
      - run: dotnet test "Windows/PS Classics fPKG Builder.sln" -p:CopyToolsToOutput=false

  cross-platform:
    name: Linux/macOS app (build + tests) - ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test CrossPlatform/PSClassicsfPKGBuilder.sln -p:CopyToolsToOutput=false

  linux-wine:
    # Runs the integration tests with the real tools through Wine, like the Linux app does:
    # PS1/PS2/PSP packages are built from synthetic discs and checked with the SDK checker.
    name: Linux integration (real tools via Wine)
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TOOLS_RELEASE: v2.1.0
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install Wine and winetricks
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends wine wine32:i386 wine64 winetricks xvfb cabextract unzip
          wine --version
      - name: Get the Tools folder from the Windows release
        run: |
          gh release download "$TOOLS_RELEASE" --repo "$GITHUB_REPOSITORY" --pattern '*.Windows.zip' --dir _release
          unzip -q _release/*.zip 'Tools/*' -d _release/x
          mv _release/x/Tools Tools
          ls Tools/PS4
      - name: Prepare the Wine prefix of the app (same as the Wine setup button)
        run: |
          export WINEPREFIX="$HOME/.local/share/PSClassicsfPKGBuilder/wine-prefix" WINEDEBUG=-all WINEDLLOVERRIDES="mscoree,mshtml="
          mkdir -p "$(dirname "$WINEPREFIX")"
          xvfb-run -a wineboot --init
          xvfb-run -a winetricks -q vcrun2008
          # wineserver is not on PATH on Ubuntu (/usr/lib/wine/wineserver64); wait for Wine to finish writing the prefix
          for ws in wineserver /usr/lib/wine/wineserver64 /usr/lib/wine/wineserver32 /usr/lib/wine/wineserver; do
            if command -v "$ws" >/dev/null 2>&1; then "$ws" -w; break; fi
          done
          ls "$WINEPREFIX/drive_c/windows/winsxs" | grep -i vc90 | head -5
      - run: dotnet test Shared/PSClassics.Core.Tests -p:CopyToolsToOutput=false --logger "console;verbosity=normal"
